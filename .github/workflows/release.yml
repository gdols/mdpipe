name: Release

# Tag a commit as v0.2.0 (or any v*) and this builds the portable exe
# and attaches it to a draft release, ready to write notes and publish.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test -c Release

      - name: Publish portable exe
        run: >
          dotnet publish src/MdPipe.Wpf -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true

      - name: Attach the exe to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = "src/MdPipe.Wpf/bin/Release/net10.0-windows/win-x64/publish/MdPipe.exe#MdPipe.exe"
          gh release view ${{ github.ref_name }} 2>$null
          if ($LASTEXITCODE -eq 0) {
            # The release was created by hand; just make sure it carries the freshly built exe.
            gh release upload ${{ github.ref_name }} $exe --clobber
          } else {
            gh release create ${{ github.ref_name }} --draft --title "MdPipe ${{ github.ref_name }}" --generate-notes $exe
          }
