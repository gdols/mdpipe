name: Release

# Push a v* tag: builds the portable exe and attaches it to a draft release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Tag, Directory.Build.props and the manifest have to say the same version.
      - name: The tag, the build and the manifest must agree
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $props = Select-Xml -Path Directory.Build.props -XPath '//Version'
          $version = $props.Node.InnerText.Trim()
          $manifest = (Get-Content manifest/markitdown-compat.json -Raw | ConvertFrom-Json).app.latestVersion

          "tag                  : $tag"
          "Directory.Build.props: $version"
          "manifest app.latest  : $manifest"

          if ($tag -ne $version -or $tag -ne $manifest) {
            Write-Error "These have to match. Update Directory.Build.props and manifest/markitdown-compat.json, then retag."
            exit 1
          }

      - name: Test
        run: dotnet test -c Release

      - name: Publish portable exe
        run: >
          dotnet publish src/MdPipe.Wpf -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true

      # Start the real single-file exe and wait for its window (0.6.0 passed the tests and didn't open).
      - name: The executable has to actually open
        shell: pwsh
        run: |
          $exe = "src/MdPipe.Wpf/bin/Release/net10.0-windows/win-x64/publish/MdPipe.exe"
          $process = Start-Process $exe -PassThru

          $title = $null
          foreach ($attempt in 1..60) {
            Start-Sleep -Seconds 1
            $process.Refresh()

            if ($process.HasExited) {
              throw "MdPipe.exe exited on startup with code $($process.ExitCode)."
            }

            if ($process.MainWindowTitle) { $title = $process.MainWindowTitle; break }
          }

          if (-not $title) {
            $process.Kill()
            throw "MdPipe.exe never opened a window."
          }

          "Window title: $title"

          # The crash dialog is titled just "MdPipe".
          if ($title -eq "MdPipe") {
            $process.Kill()
            throw "MdPipe.exe opened an error dialog instead of its window."
          }

          if ($title -notlike "MdPipe - *") {
            $process.Kill()
            throw "Unexpected window title: $title"
          }

          $process.Kill()
          "The executable opens."

      # The in-app updater won't install a download it can't check against this.
      - name: Write down the checksum
        shell: pwsh
        run: |
          $built = "src/MdPipe.Wpf/bin/Release/net10.0-windows/win-x64/publish/MdPipe.exe"
          $hash = (Get-FileHash $built -Algorithm SHA256).Hash
          "$hash  MdPipe.exe" | Out-File "$built.sha256" -Encoding ascii -NoNewline
          "SHA256: $hash"

      - name: Attach the exe to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = "src/MdPipe.Wpf/bin/Release/net10.0-windows/win-x64/publish"
          $assets = @("$dir/MdPipe.exe#MdPipe.exe", "$dir/MdPipe.exe.sha256#MdPipe.exe.sha256")
          gh release view ${{ github.ref_name }} 2>$null
          if ($LASTEXITCODE -eq 0) {
            # Release already exists, just replace the files.
            gh release upload ${{ github.ref_name }} $assets --clobber
          } else {
            gh release create ${{ github.ref_name }} --draft --title "MdPipe ${{ github.ref_name }}" --generate-notes $assets
          }

