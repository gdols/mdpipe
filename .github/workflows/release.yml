name: Release

# Tag a commit as v0.2.0 (or any v*) and this builds the portable exe
# and attaches it to a draft release, ready to write notes and publish.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The tag, the version the build stamps on itself and the version the manifest advertises are
      # three separate files. Publishing a release that forgets one of them is exactly the mistake
      # the update notice exists to avoid, so the release refuses to build instead.
      - name: The tag, the build and the manifest must agree
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $props = Select-Xml -Path Directory.Build.props -XPath '//Version'
          $version = $props.Node.InnerText.Trim()
          $manifest = (Get-Content manifest/markitdown-compat.json -Raw | ConvertFrom-Json).app.latestVersion

          "tag                  : $tag"
          "Directory.Build.props: $version"
          "manifest app.latest  : $manifest"

          if ($tag -ne $version -or $tag -ne $manifest) {
            Write-Error "These have to match. Update Directory.Build.props and manifest/markitdown-compat.json, then retag."
            exit 1
          }

      - name: Test
        run: dotnet test -c Release

      - name: Publish portable exe
        run: >
          dotnet publish src/MdPipe.Wpf -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true

      # Published alongside the executable so a copy of MdPipe updating itself has something to
      # check the download against. Without it the updater refuses and sends the user to the
      # browser instead, which is the safe direction to fail in but a worse experience.
      - name: Write down the checksum
        shell: pwsh
        run: |
          $built = "src/MdPipe.Wpf/bin/Release/net10.0-windows/win-x64/publish/MdPipe.exe"
          $hash = (Get-FileHash $built -Algorithm SHA256).Hash
          "$hash  MdPipe.exe" | Out-File "$built.sha256" -Encoding ascii -NoNewline
          "SHA256: $hash"

      - name: Attach the exe to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = "src/MdPipe.Wpf/bin/Release/net10.0-windows/win-x64/publish"
          $assets = @("$dir/MdPipe.exe#MdPipe.exe", "$dir/MdPipe.exe.sha256#MdPipe.exe.sha256")
          gh release view ${{ github.ref_name }} 2>$null
          if ($LASTEXITCODE -eq 0) {
            # The release was created by hand; just make sure it carries the freshly built exe.
            gh release upload ${{ github.ref_name }} $assets --clobber
          } else {
            gh release create ${{ github.ref_name }} --draft --title "MdPipe ${{ github.ref_name }}" --generate-notes $assets
          }

