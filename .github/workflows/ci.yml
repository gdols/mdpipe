name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The converter tests drive a real worker process, because what they are testing is MdPipe
      # surviving that process misbehaving. The scripts they run import nothing, so this costs a
      # few seconds and none of the several hundred megabytes a real MarkItDown would.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build
