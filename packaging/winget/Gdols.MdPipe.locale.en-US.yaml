ShortDescription: Convert PDF, Word, Excel, PowerPoint, HTML and images to Markdown on Windows.
Description: |-
  MdPipe converts documents to Markdown on Windows, as a portable desktop application and as a
  .NET CLI. Conversion runs through Microsoft MarkItDown, which MdPipe downloads into its own
  private Python environment on first launch, so nothing on the machine is modified and no
  Python or .NET install is required.

  It reads PDF, Word, Excel, PowerPoint, EPUB, HTML, images, audio, Outlook messages and zip
  archives, and reports what it can convert by asking the engine installed on that computer
  rather than from a list written by hand. Conversion is local: no documents are uploaded and
  no telemetry is collected.

  Not affiliated with Microsoft.
